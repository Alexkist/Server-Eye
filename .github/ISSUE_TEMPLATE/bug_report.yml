name: Bug Report
description: Report an issue or problem with Server Eye
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: "Before creating a Bug Report, please check if updating Server Eye fixes the issue."

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Please describe what exactly happened.
      placeholder: Description goes here!
    validations:
      required: true

  - type: textarea
    id: how-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the bug you have found.
      placeholder: List the steps here!
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: Please provide a description of what you expected would happen.
      placeholder: Describe what you expected to happen here.
    validations:
      required: true

  - type: input
    id: mod-loader
    attributes:
      label: Mod Loader
      description: "Please provide the Mod Loader you used and the Mod Loader's Version."
      placeholder: "NeoForge 21.1.247 (MC 1.21.1)"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Client
        - Server
        - Client and Server
        - Uncertain
    validations:
      required: true

  - type: dropdown
    id: server-eye-version
    attributes:
      label: Server Eye Version
      options:
        - v1.4
        - v1.3
        - v1.2
        - v1.1
        - v1.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: If you have a crash report and you think it is useful, upload it to https://mclo.gs
      placeholder: https://mclo.gs/
    validations:
      required: false
